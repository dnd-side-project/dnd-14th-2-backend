# Multi-tenancy 비활성화
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  # 로컬 파일시스템에 로그 데이터 저장
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  # 단일 인스턴스이므로 1로 설정
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# 인덱스 스키마 설정
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  # 7일 이상 된 로그는 수집 거부
  reject_old_samples_max_age: 168h

# Grafana Labs 사용 통계 전송 비활성화
analytics:
  reporting_enabled: false
