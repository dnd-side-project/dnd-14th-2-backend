plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.epages.restdocs-api-spec' version '0.19.4'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {

	// spring
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// logback json
	implementation 'net.logstash.logback:logstash-logback-encoder:9.0'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// mysql driver
	runtimeOnly 'com.mysql:mysql-connector-j'

	// jjwt
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	// google oauth
	implementation 'com.google.api-client:google-api-client:2.8.1'

	// nimbus-jose-jwt
	implementation 'com.nimbusds:nimbus-jose-jwt:10.7'

	// test
	testImplementation 'com.squareup.okhttp3:mockwebserver:5.3.2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // swagger
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.19.4'

    // aws
    implementation(platform("io.awspring.cloud:spring-cloud-aws-dependencies:3.1.1"))
    implementation("io.awspring.cloud:spring-cloud-aws-starter-s3")
}

ext {
    // REST Docs가 생성하는 snippets 출력 경로
    snippetsDir = file('build/generated-snippets')

    // 실행 시 활성화할 Spring profile
    runProfile = (project.findProperty('runProfile')
            ?: project.findProperty('profile')
            ?: System.getenv('SPRING_PROFILES_ACTIVE')
            ?: 'local') as String

    // "Try it out" 기본 서버 주소
    openApiServer = (project.findProperty('openApiServer')
            ?: System.getenv('OPENAPI_SERVER')
            ?: 'http://localhost:8080') as String
}

openapi3 {
    server = openApiServer

    title = "Pickle API"
    description = "Pickle REST API"
    format = 'yaml'

    outputDirectory = layout.buildDirectory.dir('api-spec').get().asFile.path
}

def openapiFile = layout.buildDirectory.file("api-spec/openapi3.yaml")
def apiDocsOutDir = layout.buildDirectory.dir("generated-docs/static/api-docs")

tasks.register('docsTest', Test) {
    group = 'verification'
    useJUnitPlatform {
        includeTags 'restdocs'
    }

    outputs.dir snippetsDir
    systemProperty 'spring.profiles.active', 'test'
}

tasks.matching { it.name == 'openapi3' }.configureEach {
    dependsOn tasks.named('docsTest')
}

tasks.register("copyOpenApiToStatic", Copy) {
    dependsOn tasks.matching { it.name == "openapi3" }
    from(openapiFile)
    into(apiDocsOutDir)
    rename { "openapi3.yaml" }
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'restdocs'
    }
}

tasks.named('bootRun') {
    dependsOn tasks.named("copyOpenApiToStatic")
    systemProperty 'spring.profiles.active', runProfile
    classpath += files(layout.buildDirectory.dir("generated-docs"))
}

tasks.named('bootJar') {
    dependsOn tasks.named('copyOpenApiToStatic')
    from(apiDocsOutDir) {
        into("BOOT-INF/classes/static/api-docs")
    }
}
