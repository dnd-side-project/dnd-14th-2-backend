name: Backend Manual Prod CD

on:
  workflow_dispatch:

jobs:
  build:
    name: Docker 이미지 빌드
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle

      - name: gradlew 실행 권한 설정
        run: chmod +x gradlew

      - name: Gradle 빌드 (테스트 제외)
        run: ./gradlew clean build -x test -x docsTest

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/backend-app:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 운영 배포
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: SSH로 운영 배포 (Nginx -> Prod)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NGINX_SERVER_HOST }}
          username: ${{ secrets.NGINX_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            echo "🚀 운영 배포 시작 (Nginx -> Prod)"
            
            ssh prod "PROD_ENV_FILE='${{ secrets.PROD_ENV_FILE }}' bash ~/app/deploy.sh"
            
            echo "⛑️ 헬스 체크..."
            for i in $(seq 1 20); do
              sleep 3
              STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
                --connect-timeout 3 --max-time 5 \
                "${{ secrets.PROD_HEALTHCHECK_URL }}" || echo "000")
              if [[ "$STATUS" == "200" ]]; then
                echo "✅ 배포 성공! (status=$STATUS)"
                exit 0
              fi
              echo "Attempt $i/20: status=$STATUS"
            done

            echo "❌ 배포 실패"
            exit 1
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
